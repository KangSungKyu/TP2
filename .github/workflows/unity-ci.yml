name: Unity CI

on:
  push:
    branches: [ "main", "portfolio" ]
  pull_request:
    branches: [ "main", "portfolio" ]

jobs:
  lint-and-validate:
    name: Code & Asset Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          echo "Checking C# project structure..."
          dotnet --version
